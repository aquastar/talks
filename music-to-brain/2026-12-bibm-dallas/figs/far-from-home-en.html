.bigplay[hidden]{display:none}

.opts{display:flex;gap:16px;color:var(--mut)}

.duo{position:absolute;top:4px;display:flex;gap:10px}.duo button{font-size:17px;padding:4px 16px;min-width:170px}
.credit{font-size:.85rem;color:var(--mut)}
body.emb{padding:0 !important}body.emb .credit{display:none}
</style>

function layout(t){const s=t<76.3?0:t<77.8?sm((t-76.3)/1.5):t<134.6?1:t<136.0?1-sm((t-134.6)/1.4):0;

const P=(L,ang,rr)=>[L.cx+(rr??L.r)*Math.cos(ang*Math.PI/180),L.cy-(rr??L.r)*Math.sin(ang*Math.PI/180)];
// ---------- drawing ----------
function bg(){g.fillStyle='#F4F0EA';g.fillRect(0,0,W,H)}

 g.fillStyle='#D9CE7C';rr(x+4,y+4,w-8,40,10);g.fill();g.fillStyle='#C4B962';for(let i=0;i<46;i++)for(let j=0;j<9;j++){g.beginPath();g.arc(x+10+i*4.1,y+9+j*4,0.9,0,7);g.fill()}

 // scale nodes

// ---------- audio ----------
let ctx=null,master=null;
